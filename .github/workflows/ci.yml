name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PG_VIEWS_DIR: /tmp/pg_views
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate data and check the committed CSVs are current
        run: |
          python -m src.export
          git diff --exit-code -- data/processed data/supabase

      - name: Build the database in Postgres 17 and load every CSV
        run: bash scripts/pg_check.sh

      - name: Run tests (including SQL views vs. Python)
        run: python -m pytest -v
